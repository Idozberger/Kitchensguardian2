name: foodkitchen
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  camera: ^0.11.2
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  fluttertoast: ^9.0.0
  fpdart: ^1.1.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  infinite_scroll_pagination: ^5.1.1
  internet_connection_checker_plus: ^2.9.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  permission_handler: ^12.0.1
  pinput: ^5.0.2
  rating_and_feedback_collector: ^0.0.3
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  syncfusion_flutter_sliders: ^31.1.19
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
  - assets/images/
  # - assets/langs/
  - assets/fonts/
  - assets/svgs/

  fonts:
  - family: SFProDisplay
    fonts:
    - asset: assets/fonts/SFPRODISPLAYMEDIUM.otf
    - asset: assets/fonts/SFPRODISPLAYREGULAR.otf
    - asset: assets/fonts/SFPRODISPLAYBOLD.otf
