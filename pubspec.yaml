name: foodkitchen
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  android_intent_plus: ^6.0.0
  cached_network_image: ^3.4.1
  camera: ^0.11.2
  cloud_firestore: ^6.1.0
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  fluttertoast: ^9.0.0
  fpdart: ^1.1.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  google_sign_in: ^6.2.1
  googleapis_auth: ^2.0.0
  image_picker: ^1.2.0
  internet_connection_checker_plus: ^2.9.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  lottie: ^3.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^5.0.2
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  syncfusion_flutter_sliders: ^31.1.19
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
  - assets/images/
  - assets/services/
  - assets/fonts/
  - assets/svgs/
  - assets/lotties/

  fonts:
  - family: SFProDisplay
    fonts:
    - asset: assets/fonts/SFPRODISPLAYMEDIUM.otf
    - asset: assets/fonts/SFPRODISPLAYREGULAR.otf
    - asset: assets/fonts/SFPRODISPLAYBOLD.otf
